name: Build APK

on:
  push:
    branches: [main, master, fix/**]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          set +e
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::group::Gradle failure excerpts"
            # Surface real compiler/Gradle errors as annotations (public without token)
            grep -E '^(e: |w: |FAILURE:|\\* What went wrong:|Execution failed|Unresolved reference|error:|e: file://)' build.log | tail -n 80 | while IFS= read -r line; do
              echo "::error title=Gradle::$line"
            done
            # Also dump a short tail for the job summary
            {
              echo '### Build failed'
              echo '```'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
            exit "$code"
          fi
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raamses-console-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: raamses-console-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
